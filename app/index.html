<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#102b2a">
<link rel="icon" href="data:,">
<link rel="stylesheet" href="./style.css">
<script type="module" src="./app.js"></script>
<title>Vice Meridian · GTA VI trophy guide</title>
</head>
<body>
<header class="top">
  <a class="brand" href="#/"><span class="compass" aria-hidden="true">✥</span> VICE MERIDIAN</a>
  <nav aria-label="Guide views">
    <a data-view="checklist" href="#/">Checklist</a>
    <a data-view="roadmap" href="#/roadmap">Roadmap</a>
    <a data-view="sources" href="#/sources">Sources &amp; audit</a>
  </nav>
  <button id="spoiler" type="button" aria-pressed="true"></button>
</header>
<main>
  <section class="hero" id="hero" aria-labelledby="title">
    <div class="landscape" aria-hidden="true"><i></i><b></b><span></span></div>
    <div class="title-block">
      <p class="eyebrow">GRAND THEFT AUTO VI <span> / </span> PLAYSTATION 5</p>
      <h1 id="title">Vice Meridian<span>.</span></h1>
      <p>Trophy guide &amp; platinum tracker</p>
    </div>
    <div id="progress"></div>
  </section>
  <div id="checklist">
    <section class="tools" aria-label="Trophy filters">
      <div class="tool-line">
        <label class="search"><span aria-hidden="true">⌕</span><input id="search" type="search" placeholder="Search trophies…" aria-label="Search trophies"></label>
        <select id="grade" aria-label="Grade"><option value="">All grades</option><option>Platinum</option><option>Gold</option><option>Silver</option><option>Bronze</option></select>
        <select id="status" aria-label="Earned status"><option value="">Any status</option><option value="open">Not earned</option><option value="earned">Earned</option></select>
        <select id="sort" aria-label="Sort trophies"><option value="route">Roadmap order</option><option value="grade">Grade</option><option value="name">A–Z</option></select>
      </div>
      <div id="kinds" class="chips" role="group" aria-label="Trophy categories"></div>
    </section>
    <div class="workspace">
      <section aria-labelledby="list-title" class="register">
        <div class="section-band"><h2 id="list-title">Trophy register</h2><span id="matches" aria-live="polite"></span></div>
        <div id="list" class="list"></div>
      </section>
      <aside id="detail" aria-label="Trophy guide"></aside>
    </div>
  </div>
  <section id="page" hidden></section>
  <footer>
    <span>Progress saved on this device</span>
    <div><button id="export">Export</button> <button id="import">Import</button> <button id="reset">Reset</button></div>
    <input id="file" type="file" accept=".json,application/json" hidden>
    <span id="message" role="status"></span>
  </footer>
</main>
</body>
</html>
